[package]
name = "zcode-pool"
version = "1.0.1"
description = "ZCode 账号池：邮箱库 / 批量注册验证 / 账号切换"
license = "MIT"
edition = "2021"

# 业务核心（gatewayd 无头守护也在这里）独立成 crate，桌面壳只做 GUI。
[workspace]
members = ["core"]
resolver = "2"

[lib]
name = "zcode_pool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 生产构建必须开它：tauri 的 build.rs 用 dev = !custom-protocol 决定 WebView 加载
# 内嵌 dist 资源还是去连 devUrl(127.0.0.1:5173)。裸 cargo build --release 会静默
# 打出开发壳 —— 面板显示"127.0.0.1 拒绝连接"。
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zcode-pool-core = { path = "core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
# 移动端 OAuth：安卓没有子窗口能力，登录页交给系统浏览器（poll 通道负责收尾）。
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7"] }

# 托盘 / 开机自启 / 单实例只在桌面有意义（安卓没有系统托盘、由前台服务保活、
# 系统保证单实例）。移动端不引入这三个插件 crate，否则编译期就缺 API。
# ⚠ 这里必须用 cargo 内建的 target_os 判定：`cfg(desktop)` 是 tauri-build 给源码
#   设的自定义 cfg，cargo 的 [target.'cfg(...)'.dependencies] 选择器看不到它（会恒为假，
#   导致桌面也漏链接插件）。源码里仍用 #[cfg(desktop)]，那是有效的。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
] }

[profile.release]
strip = "symbols"
lto = "thin"
