name: Linux

# Linux x64 构建：产出 .deb + .AppImage，仅上传 Actions artifacts，
# 不挂 GitHub Release（仓库当前策略：artifacts-only；Windows 走 release.yml）。
# 触发：打 v* 标签，或手动 dispatch（与 release.yml 同标签触发互不干扰，各传各的产物）。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: build (linux-x64 deb+appimage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      # Tauri v2 Linux 依赖（官方 prerequisites 文档约定）：
      # - libwebkit2gtk-4.1-dev：WebView 后端
      # - libayatana-appindicator3-dev：托盘（本工程开了 tauri 的 tray-icon feature）。
      #   注意官方包名是 ayatana 版，旧名 libappindicator3-dev 已不推荐。
      # - librsvg2-dev：图标渲染（build.rs 光栅化 svg）
      # - patchelf：linuxdeploy 打 AppImage 时需要改写 ELF
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm install

      # ring 在 Linux x86_64 上用系统 cc 编 C 即可（clang 只是 Windows ARM64 的 MSVC 兜底，这里不需要）。
      # --bundles 显式覆盖 tauri.conf.json 里的 ["nsis"]；不传 --target，直接编宿主三元组
      # x86_64-unknown-linux-gnu。产物落 src-tauri/target/release/bundle/{deb,appimage}/。
      - name: Build deb + AppImage
        run: npm run tauri build -- --bundles deb,appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zcode-pool-linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
