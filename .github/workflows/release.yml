name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (windows-arm64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Windows ARM64 target
        run: rustup target add aarch64-pc-windows-msvc

      # ring 在 Windows ARM64 上必须用 clang 编译 C 代码（MSVC cl.exe 不行）。
      # 镜像自带 LLVM，这里只做兜底：万一 clang 不在 PATH，把标准安装路径补进去。
      - name: Ensure clang for Windows ARM64
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue) -and (Test-Path 'C:\Program Files\LLVM\bin')) {
            Add-Content $env:GITHUB_PATH 'C:\Program Files\LLVM\bin'
            'clang was not on PATH; added C:\Program Files\LLVM\bin'
          } else {
            'clang already available'
          }

      - run: npm install

      # 版本号从 package.json 读，不写死 —— 写死会导致构建出的包（1.0.1）挂在
      # 旧版本号的 release（v1.0.0）下，下载的人容易装错包。
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build & attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || steps.ver.outputs.v }}
          releaseName: "Z·POOL ${{ github.ref_type == 'tag' && github.ref_name || steps.ver.outputs.v }} (Windows ARM64)"
          releaseBody: |
            ZCode 账号池 · Windows on ARM fork（zcode-pool-WOA）

            相比上游 [Limitinfinitude/zcode-pool](https://github.com/Limitinfinitude/zcode-pool) 的更新：

            - **Windows ARM64 原生支持**：`aarch64-pc-windows-msvc` 原生构建，
              可在 Snapdragon X / Surface 等 ARM64 设备原生运行，无需 x64 模拟。
              网关请求头 `x-platform` 改为按实际架构上报（x64 上取值不变）。
            - **登录国际站修复**：「授权登录走代理」贯穿 OAuth 全链路（授权初始化 / 登录窗口 / 换取令牌），
              未显式设置时自动跟随 Windows 系统代理；启用 socks5 代理支持。
              修复国内出口下登录被重定向到国内版、邮箱登录不可用的问题。
            - **ZCode 安装路径探测修复**：反代抽取系统提示词时补扫 `C:\Program Files (x86)\ZCode\`，
              修复 x64 版 ZCode 装在 (x86) 目录（ARM64 设备上的常见落点）时反代本地 503 的问题。
            - **局域网共享与 API Key 管理**：设置页直接管理 —— 允许局域网设备访问（开关）、
              生成/复制/删除 API Key、一键复制客户端配置实例（Base URL + Anthropic/OpenAI 端点）。
            - **账号包跨设备可移植**：导出时把 ZCode 的机器绑定密文解平成明文（ZCode 的密文密钥
              派生自 `platform:home:username`，换机解不开 → 手机端号全部"没登录" → 反代报
              `no-account` / 话没说完就断）。现在 PC 导出的包导到手机可直接用。
            - **反代 502 归因**：`no-account` 不再只说"没有可用的号"，会具体指出是
              凭据解不开 / 该模型无额度 / 限流或 3012 冷却 / 号刚被截断降级。

            本 fork 仅构建 Windows ARM64 安装包；其他平台请使用上游
            [Limitinfinitude/zcode-pool](https://github.com/Limitinfinitude/zcode-pool/releases) 的发布。

            程序未签名，首次运行系统可能提示来源未知。
          releaseDraft: true
          prerelease: false
          args: --target aarch64-pc-windows-msvc --bundles nsis

      # 产物同时以 artifact 存一份（draft release 之外，方便脚本直接取回归档）
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: zcode-pool-windows-arm64
          path: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
